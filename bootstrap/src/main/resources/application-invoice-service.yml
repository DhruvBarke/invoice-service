# Party registration cache and alerting.
#
# Adopting into your repo: merge these keys into your existing application.yml, or keep this file
# and add "invoice-service" to spring.profiles.include.

invoice:
  service:

    # ---- Cache sizing, per key space -------------------------------------------------------
    # Separate because SIRET is usually highest-volume and BDR ids are usually most stable.
    siren:
      ttl: 30m
      volatile-ttl: 5m          # corrections and blocks: must react to out-of-band changes
      max-entries: 50000
    siret:
      ttl: 30m
      volatile-ttl: 5m
      max-entries: 150000
    bdr-id:
      ttl: 1h
      volatile-ttl: 5m
      max-entries: 200000

    alerting:

      # SAFETY SWITCH. False installs the pass-through guard: no detection, no quarantine rows,
      # NO BLOCKING. This is NOT how to stop emails — use alerting.email.enabled below.
      # Changing this is a reviewable act, not an incident-time toggle.
      enabled: true

      # ---- What is DETECTED, RECORDED and BLOCKED ----------------------------------------
      # The mandatory checks (nothing returned, missing SIREN, multiple records for a
      # single-valued key) always run and are not configurable.
      detection:
        inbound-missing-siret: true
        outbound-missing-siret: true
        inbound-golden-mismatch: true
        outbound-golden-mismatch: false   # elementary ids are used deliberately outbound

      # ---- What is EMAILED. Never affects blocking. ---------------------------------------
      email:
        enabled: true
        recipients:
          - data-quality@example.com
          - invoice-ops@example.com
        subject-prefix: "[PROD][party-referential]"
        # The most important setting: converts an alert storm into one message. Longer is usually
        # better — aggregation means nothing is lost, only delayed.
        digest-interval: 5m
        minimum-servability: SERVABLE     # BLOCKING = only email defects that stop processing
        immediate-servability: BLOCKING   # a NEW blocking defect flushes at once
        anomaly-types:
          - NO_REGISTRATION_FOUND
          - MISSING_SIREN
          - MULTIPLE_REGISTRATIONS
          - MISSING_SIRET
          - GOLDEN_PARTY_MISMATCH
        flows: [INBOUND, OUTBOUND]
        max-fingerprints: 500
        max-retries: 3

      quarantine:
        # How quickly an operator correction reaches OTHER instances. Local eviction is immediate.
        poll-interval: 30s
        # Retire a row automatically once the referential response is clean again, so a stale
        # correction stops shadowing since-fixed upstream data.
        auto-retire-resolved: true

    # ---- E-invoice registration pipeline --------------------------------------------------
    # Applies ONLY to invoices arriving over e-invoicing (source=EINVOICE). Manual entry,
    # SGAI and other sources bypass this pipeline entirely.
    registration:

      alert:
        # One comprehensive email per FAILED invoice, listing every captured error. Unlike the
        # party-registration digest above, these are not aggregated: the email is tied to one
        # t_invoice_payable row an operator needs to open. Empty list disables alerting (the
        # errors are still stored on the row).
        recipients:
          - invoice-alerts@example.com
        subject-prefix: "[invoice-service]"

      # Per-business rule activation. A rule omitted for a business is DISABLED for it; a
      # business omitted entirely gets the empty rule set (invoices register unless the mapper
      # itself fails). Rule ids come from ValidationRule#id().
      #
      # Adding a rule: implement ValidationRule, register it in RegistrationConfig's
      # rulesById map, then switch it on here per business.
      businesses:
        MARK:
          rules:
            duplicate-invoice: true      # rule 1 — already-REGISTERED provider_reference
            attachment-present: true     # rule 2 — no attachment in JSON body nor multipart
            brokerage-trade-file: true   # rule 3 — BROKERAGE_* needs a .csv/.xlsx trade file
            line-items-present: true     # rule 4 — CUSTODY/EXCHANGE/CLEARING need line items

        # Other businesses share the generic rules but not the MARK-specific brokerage check.
        # Switch individual rules on as each business's requirements are confirmed.
        SGSS:
          rules:
            duplicate-invoice: true
            attachment-present: true
        GTPS:
          rules:
            duplicate-invoice: true
        GLBA:
          rules:
            duplicate-invoice: true
