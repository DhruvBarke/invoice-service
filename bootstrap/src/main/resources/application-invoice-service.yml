# Party registration cache and alerting.
#
# Adopting into your repo: merge these keys into your existing application.yml, or keep this file
# and add "invoice-service" to spring.profiles.include.

springdoc:
  # The spec and the UI. Both are read-only and describe one endpoint; keep them behind whatever
  # gates the rest of the actuator surface in a deployed environment.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Operations sorted as declared rather than alphabetically: the JSON form is the common case
    # and should be read first, and alphabetical ordering puts the multipart one above it.
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# Upload limits for the multipart form of the registration endpoint.
#
# Spring's own defaults are 1MB per file and 10MB per request, which is below a routine scanned
# invoice PDF and would reject real traffic. Exceeding these produces a 413 with the limit in the
# body — see MultipartExceptionHandler; without that handler the container's rejection surfaces as
# a 500, which is the one status this API tells callers to retry.
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      # Higher than max-file-size because a registration may carry several attachments: an invoice
      # PDF plus a trade file, occasionally more. Capping the request at one file's worth would
      # reject a legitimate combination that individually fits.
      max-request-size: 25MB

invoice:
  service:

    # ---- API metadata -----------------------------------------------------------------------
    # The published spec's version. The server URL is deliberately NOT configured: springdoc
    # derives it from the incoming request, which follows whatever proxy or ingress the reader
    # came through. A configured one is only right in the environments that remember to override
    # it, and confidently wrong in a document people generate clients from in the ones that do not.
    api:
      version: 1.0.0
      # Omitted from the published spec when blank. No licence is declared at all — there is not
      # one, and an invented licence in a document people generate clients from is a claim nobody
      # made. Same reasoning for the contact: fill these in and they appear, leave them and the
      # block is left out rather than filled with a plausible-looking address.
      contact-name: ""
      contact-email: ""

    # ---- Referential endpoints --------------------------------------------------------------
    # Party registration, fee categories and SGDoc all come from referential APIs. There are no
    # defaults for these URLs on purpose: a default lets the service start pointing at something
    # that does not exist and fail on the first invoice instead of at boot, which is the more
    # expensive time to find out.
    referential:
      party-base-url: https://referential.example.internal/party-registration/v1
      fee-category-base-url: https://referential.example.internal/fee-category/v1
      sg-doc-base-url: https://referential.example.internal/sgdoc/v2

      # Every alert this service raises is POSTed to {email-base-url}/email-service/send-mail.
      # The from-address is configuration because it differs per environment: a production alert
      # arriving from a test mailbox is one people learn to ignore.
      email-base-url: https://referential.example.internal
      email-from-address: invoice-service@example.internal

      # The defaults are NOT unlimited, which is what a bare RestTemplate gives you. A
      # referential that accepts a connection and then stops responding would otherwise hold the
      # calling thread until the socket gave up; under load that exhausts the request pool and
      # the whole service stops answering because one dependency is slow.
      connect-timeout-millis: 3000
      read-timeout-millis: 10000

    # ---- Cache sizing, per key space -------------------------------------------------------
    # Separate because SIRET is usually highest-volume and BDR ids are usually most stable.
    siren:
      ttl: 30m
      volatile-ttl: 5m          # corrections and blocks: must react to out-of-band changes
      max-entries: 50000
    siret:
      ttl: 30m
      volatile-ttl: 5m
      max-entries: 150000
    bdr-id:
      ttl: 1h
      volatile-ttl: 5m
      max-entries: 200000

    alerting:

      # SAFETY SWITCH. False installs the pass-through guard: no detection, no quarantine rows,
      # NO BLOCKING. This is NOT how to stop emails — use alerting.email.enabled below.
      # Changing this is a reviewable act, not an incident-time toggle.
      enabled: true

      # ---- What is DETECTED, RECORDED and BLOCKED ----------------------------------------
      # Turning a check off here means no quarantine row is ever created for it and no
      # correction is ever possible. This is NOT the way to reduce email — that is
      # alerting.email below.
      #
      # The two BLOCKING checks are absent on purpose and cannot be switched off:
      #   - the referential returned nothing for the key
      #   - a returned record has no usable SIREN
      # Neither is advisory. Disabling them would not make the data usable; it would only stop
      # anyone being told, and the invoice would register against a party that does not exist.
      detection:
        inbound-missing-siret: true
        outbound-missing-siret: true
        inbound-golden-mismatch: true
        outbound-golden-mismatch: false   # elementary ids are used deliberately outbound

        # Several parties returned for one key: inbound that is one SIREN resolving to more than
        # one registration, outbound one BDR id doing the same. Advisory rather than blocking —
        # a golden record is still selected deterministically, so the lookup has an answer. What
        # the anomaly records is that upstream deduplication disagreed with itself and the
        # selection was a genuine choice. Switch off where duplicates are expected and
        # understood, and the quarantine table stops filling with them.
        inbound-multiple-registrations: true
        outbound-multiple-registrations: true

      # ---- What is EMAILED. Never affects blocking. ---------------------------------------
      email:
        enabled: true
        recipients:
          - data-quality@example.com
          - invoice-ops@example.com
        subject-prefix: "[PROD][party-referential]"
        # The most important setting: converts an alert storm into one message. Longer is usually
        # better — aggregation means nothing is lost, only delayed.
        digest-interval: 5m
        minimum-servability: SERVABLE     # BLOCKING = only email defects that stop processing
        immediate-servability: BLOCKING   # a NEW blocking defect flushes at once
        anomaly-types:
          - NO_REGISTRATION_FOUND
          - MISSING_SIREN
          - MULTIPLE_REGISTRATIONS
          - MISSING_SIRET
          - GOLDEN_PARTY_MISMATCH
        flows: [INBOUND, OUTBOUND]
        max-fingerprints: 500
        max-retries: 3

      quarantine:
        # How quickly an operator correction reaches OTHER instances. Local eviction is immediate.
        poll-interval: 30s
        # Retire a row automatically once the referential response is clean again, so a stale
        # correction stops shadowing since-fixed upstream data.
        auto-retire-resolved: true

    # ---- E-invoice registration pipeline --------------------------------------------------
    # Applies ONLY to invoices arriving over e-invoicing (source=EINVOICE). Manual entry,
    # SGAI and other sources bypass this pipeline entirely.
    registration:

      # ---- Alerting ------------------------------------------------------------------------
      # One comprehensive email per FAILED invoice, listing every captured error. Unlike the
      # party-registration digest above these are not aggregated: each email is tied to one
      # t_invoice_payable row an operator needs to open.
      #
      # Three settings, each resolved independently and most-specific-first:
      #   fee category within a business  ->  business  ->  this service-wide block.
      # Independently, so a business that only wants its own recipients does not have to restate
      # enabled and subject-prefix to keep them.
      #
      # enabled defaults to true when nobody says otherwise. An unconfigured scope going silent
      # would hide failures in exactly the environments nobody has finished configuring, which is
      # where they matter most. Errors are stored on the row either way.
      alert:
        enabled: true
        recipients:
          - invoice-alerts@example.com
        subject-prefix: "[invoice-service]"

      # ---- Validation rules ----------------------------------------------------------------
      # A rule omitted for a scope is DISABLED there; a business omitted entirely runs nothing.
      # Rule ids come from ValidationRule#id().
      #
      # A fee-categories block REPLACES its business's rule set rather than merging with it.
      # Merging would make "switch this off for CUSTODY" inexpressible: the business entry would
      # keep turning it back on while this file read as though it were disabled.
      #
      # Adding a rule: implement ValidationRule, register it in RegistrationConfig's rulesById
      # map, then switch it on in the scopes that want it.
      businesses:
        MARK:
          rules:
            duplicate-invoice: true      # rule 1 - already-REGISTERED provider_reference
            attachment-present: true     # rule 2 - nothing attached on either channel
            brokerage-trade-file: true   # rule 3 - BROKERAGE_* needs a .csv/.xlsx trade file
            line-items-present: true     # rule 4 - CUSTODY/EXCHANGE/CLEARING need line items
          alert:
            recipients:
              - mark-invoice-ops@example.com
            subject-prefix: "[MARK]"

          fee-categories:
            # Custody invoices never carry an attachment and never carry a trade file, so the
            # two rules that look for them are left out of this set rather than switched off for
            # the whole of MARK — where brokerage still needs both.
            CUSTODY:
              rules:
                duplicate-invoice: true
                line-items-present: true

            # Brokerage keeps everything, and routes its alerts to the desk that can act on them.
            BROKERAGE_PRINCIPAL:
              rules:
                duplicate-invoice: true
                attachment-present: true
                brokerage-trade-file: true
                line-items-present: true
              alert:
                recipients:
                  - mark-brokerage@example.com
                subject-prefix: "[MARK][BROKERAGE]"

        # Other businesses share the generic rules but not MARK's brokerage check. Switch
        # individual rules on as each business's requirements are confirmed.
        SGSS:
          rules:
            duplicate-invoice: true
            attachment-present: true
          alert:
            recipients:
              - sgss-invoice-ops@example.com
            subject-prefix: "[SGSS]"
          fee-categories:
            # Internal recharges legitimately arrive bare, and nobody wants to be told so.
            INTERNAL_RECHARGE:
              rules:
                duplicate-invoice: true
              alert:
                enabled: false

        GTPS:
          rules:
            duplicate-invoice: true
        GLBA:
          rules:
            duplicate-invoice: true
